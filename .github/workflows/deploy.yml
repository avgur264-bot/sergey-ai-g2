name: build-and-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      # Дымовые прогоны настоящих страниц в эмуляции браузера: ловят то,
      # что модульные тесты не видят — падение скрипта на старте, разрыв
      # цепочки «речь → инструмент → ответ», молчащую голосовую активацию.
      - name: Дымовой прогон
        run: |
          npx vite build
          node --experimental-strip-types scripts/smoke-settings.mjs
          node --experimental-strip-types scripts/smoke-main.mjs
          MODE=question node --experimental-strip-types scripts/smoke-main.mjs
          WAKE=1 node --experimental-strip-types scripts/smoke-main.mjs

      - name: Собрать под GitHub Pages
        run: npm run build
        env:
          GITHUB_PAGES: '1'

      - name: Собрать .ehpk
        run: npm run pack
        continue-on-error: true  # манифест может требовать ручной правки — не блокирует деплой

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sergey-ai-ehpk
          path: sergey-ai.ehpk
          if-no-files-found: ignore

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
