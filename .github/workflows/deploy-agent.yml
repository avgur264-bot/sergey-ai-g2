name: deploy-agent

# Развёртывание агента для Even AI.
#
# ЗАЧЕМ ОТДЕЛЬНЫЙ ПУТЬ. Панель Cloudflare плохо работает в мобильном
# Safari: не вставляется код, не сохраняются переменные окружения.
# Здесь всё делает раннер — он и секреты запишет, и воркер выложит.
# С телефона нужно ровно одно: один раз создать токен доступа.
#
# Нужные секреты репозитория (Settings → Secrets → Actions):
#   CLOUDFLARE_API_TOKEN — токен с правом Edit Cloudflare Workers
#   ANTHROPIC_API_KEY    — ключ sk-ant-…
#   AGENT_TOKEN          — любая длинная строка, её же в Even → Token

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'src/agent/prompt.ts'
      - 'wrangler.toml'
      - '.github/workflows/deploy-agent.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Проверить, что доступ настроен
        env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF" ]; then
            echo "::error::Нет секрета CLOUDFLARE_API_TOKEN — добавьте его в настройках репозитория"
            exit 1
          fi

      # Секреты кладём до выкладки: воркер без них отвечает подсказкой
      # «не задан ключ», и человек видит это прямо на очках.
      - name: Записать секреты воркера
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AGENT_TOKEN: ${{ secrets.AGENT_TOKEN }}
        run: |
          set -e
          printf '%s' "$ANTHROPIC_API_KEY" | npx wrangler secret put ANTHROPIC_API_KEY
          printf '%s' "$AGENT_TOKEN"       | npx wrangler secret put AGENT_TOKEN

      - name: Выложить агента
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy

      - name: Проверить, что агент отвечает
        env:
          AGENT_TOKEN: ${{ secrets.AGENT_TOKEN }}
        run: |
          set -e
          URL="https://sergey-ai-agent.avgur264.workers.dev"
          echo "Проверяю $URL"

          # Чужой токен должен отклоняться понятным текстом, а не молчанием.
          BAD=$(curl -s -X POST "$URL" \
            -H 'content-type: application/json' \
            -H 'authorization: Bearer wrong' \
            -d '{"messages":[{"role":"user","content":"тест"}]}')
          echo "$BAD" | grep -q "Токен не совпадает" \
            || { echo "::error::Проверка токена не сработала: $BAD"; exit 1; }

          echo "✓ агент развёрнут и отвечает"
